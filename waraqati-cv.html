<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منشئ السيرة الذاتية ATS</title>
<style>
:root{--g:#0c2a6a;--g2:#1d5fc4;--bg:#f2f5fa;--tx:#0f1b33;--mu:#5f6e88;--ac:#f2a20c;--ln:#dbe3f0}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#e8eefa 0,#f2f5fa 420px);color:var(--tx);line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
.nav{position:sticky;top:0;z-index:5;background:#fffe;backdrop-filter:blur(8px);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:800;color:var(--g);font-size:20px}.lg img{width:42px;height:42px;border-radius:50%}
.nav nav{display:flex;gap:4px;flex:1}.nav nav a{padding:7px 14px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--mu)}.nav nav a.on,.nav nav a:hover{background:#e9f0fd;color:var(--g)}
.nav select{padding:8px 10px;border:1.5px solid var(--ln);border-radius:10px;background:#fff;font-weight:600}
.btn{border:0;border-radius:12px;padding:10px 18px;background:var(--g);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 3px 10px #0c2a6a30}
.btn:active{transform:translateY(1px)}.btn.l{background:#fff;color:var(--g);border:1.5px solid var(--ln);box-shadow:none}.btn.o{background:var(--ac);color:#1c1300;box-shadow:0 3px 10px #f2a20c55}.btn.s{padding:7px 12px;font-size:14px}
main{max-width:1180px;margin:0 auto;padding:0 18px}
.pg{display:none}.pg.on{display:block}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center;padding:56px 0 40px}
.hero h1{font-size:clamp(28px,4.6vw,48px);line-height:1.35;margin:0 0 14px;color:var(--g);font-weight:800}.ac{color:var(--ac)}
.hero p{font-size:17px;color:var(--mu);max-width:560px;margin:0 0 26px}.hero .row{display:flex;gap:12px;flex-wrap:wrap}.hero .btn{padding:13px 26px;font-size:16px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.tags span{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:4px 12px;font-size:13px;color:var(--g);font-weight:600}
.mock{justify-self:center;border-radius:18px;box-shadow:0 18px 48px #0c2a6a2a;border:1px solid var(--ln);background:#fff;}
.mv{position:relative;overflow:hidden;width:var(--w,300px);height:var(--h,380px);border-radius:inherit}
.mi{position:absolute;left:50%;top:0;width:794px;transform:translateX(-50%) scale(var(--k,.38));transform-origin:top center}
.h2{text-align:center;margin:40px 0 6px;color:var(--g);font-size:30px;font-weight:800}.sb{text-align:center;color:var(--mu);margin:0 0 26px}
.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;padding-bottom:50px}
.tc{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:16px;text-align:center;box-shadow:0 6px 24px #0c2a6a14}
.tc .mv{margin:0 auto 12px;--w:100%;--h:340px;--k:.37;border:1px solid var(--ln);border-radius:12px}.tc b{display:block;font-size:19px;color:var(--g);margin-bottom:8px}
.eg{display:grid;grid-template-columns:minmax(320px,1fr) minmax(0,1.1fr);gap:22px;padding:26px 0 50px;align-items:start}
.card{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:18px;box-shadow:0 6px 24px #0c2a6a14}
.card h2{margin:0 0 12px;color:var(--g);font-size:24px}
.tabs{display:flex;gap:4px;background:#eef3fb;border-radius:12px;padding:4px;margin-bottom:12px}.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:700;color:var(--mu);cursor:pointer}.tabs button.on{background:#fff;color:var(--g);box-shadow:0 2px 6px #0c2a6a1c}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px;color:var(--g)}
input,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--ln);border-radius:12px;background:#fbfcfe}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--g2);box-shadow:0 0 0 3px #1d5fc42a}
.ic{border:1px solid var(--ln);border-right:4px solid var(--ac);border-radius:14px;padding:6px 12px 12px;margin:10px 0;background:#f8faff;display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.ic>div{grid-column:1/-1}.ic>.half{grid-column:auto}
.x{grid-column:1/-1;justify-self:end;border:0;background:none;color:#b3261e;font-weight:700;cursor:pointer;padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chips span{background:#e9f0fd;color:var(--g);border-radius:18px;padding:4px 6px 4px 12px;font-weight:600;display:flex;gap:6px;align-items:center}.chips button{border:0;background:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;color:#b3261e}
.row2{display:flex;gap:8px}.row2 .btn{flex:0 0 auto}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.tools .sp{flex:1}
.seg{display:flex;background:#eef3fb;border-radius:12px;padding:3px}.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:700;color:var(--mu);cursor:pointer}.seg button.on{background:var(--g);color:#fff}
.pv{position:relative;overflow:hidden;background:#dfe6f2;border-radius:14px;border:1px solid var(--ln)}
#pw{position:absolute;left:50%;top:12px;width:794px;transform-origin:top center}
.mt{display:none;margin-bottom:12px}
footer{background:var(--g);color:#fff;padding:26px 18px;text-align:center}footer img{width:54px;height:54px;border-radius:50%;background:#fff}footer p{margin:6px 0;opacity:.85}
.ct2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;direction:ltr}.ct2 a{color:#fff;border:1px solid #ffffff55;border-radius:20px;padding:4px 14px;text-decoration:none;font-size:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 18px;border-radius:14px;z-index:9;display:none;max-width:90%;text-align:center}
#intro{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;z-index:20;overflow:hidden;overscroll-behavior:none;touch-action:none;background:radial-gradient(circle at 80% 10%,#1d5fc4 0,#0c2a6a 55%,#071a45 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 20px 16px;gap:0}
#intro:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:#f2a20c22;left:-120px;bottom:-140px;pointer-events:none}
#intro>*{position:relative}
#intro .ls{position:absolute;top:12px;inset-inline-end:14px;margin:0;z-index:2}
#intro .lw{margin:0}
#intro .lo{flex:0 0 auto;width:min(40vw,170px,22vh);height:min(40vw,170px,22vh);border-radius:50%;background:#fff;padding:6px;box-shadow:0 14px 50px #0008;object-fit:contain;margin:0}
#intro h1{font-size:clamp(28px,min(8vw,6vh),54px);margin:1.5vh 0 2px;font-weight:800;line-height:1.2}
#intro .t{font-size:clamp(20px,min(5.2vw,4vh),34px);color:#fff;font-weight:800;line-height:1.35;margin:1.5vh 0 2px}
#intro .sb2{opacity:.8;margin:6px 0 2.5vh;font-size:14px}
#enter{border:0;border-radius:16px;background:var(--ac);color:#1c1300;font-weight:800;font-size:19px;padding:12px 56px;cursor:pointer;box-shadow:0 10px 30px #f2a20c66}
#enter:after{content:" ‹"}[dir=ltr] #enter:after{content:" ›"}
#intro .chips2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:2vh}#intro .chips2 span{border:1px solid #ffffff55;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:600}
#intro .ct2{margin:2vh 0 0}
@media(max-height:640px){#intro{padding-top:56px}#intro .sb2,#intro .chips2{display:none}}
@media(max-height:480px){#intro .ct2{display:none}#intro .lo{width:min(18vh,90px);height:min(18vh,90px)}}
body.io{overflow:hidden;position:fixed;width:100%}
.lw{position:relative;display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#f2a20c,#ffc233);border-radius:14px;box-shadow:0 4px 14px #f2a20c66;padding:0 12px;margin-inline-start:14px;cursor:pointer;font-size:18px}
.lw:after{content:"▾";font-size:12px;color:#1c1300}.lw:hover{filter:brightness(1.05)}
.lw select,.nav .lw select{appearance:none;-webkit-appearance:none;background:transparent;border:0;box-shadow:none;font-weight:800;font-size:15px;color:#1c1300;padding:9px 2px;cursor:pointer;border-radius:0}.lw select option{color:#111;background:#fff}
.bk{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--g);border:1.5px solid var(--ln);border-radius:12px;padding:9px 18px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px #0c2a6a14;margin:18px 0 0}.bk:before{content:"→"}[dir=ltr] .bk:before{content:"←"}.bk:active{background:#e9f0fd}
/* السيرة */
.cv{width:794px;min-height:1123px;padding:60px 64px;background:#fff;color:#111;font-family:Arial,Tahoma,sans-serif;font-size:15px;line-height:1.55;text-align:start}
.cv h1{margin:0;font-size:34px;line-height:1.2}.cv .ttl{font-size:17px;margin-top:2px}.cv .ct{font-size:14px;margin-top:6px;color:#333}
.cv h2{font-size:15px;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.5px}.cv p{margin:4px 0;white-space:pre-line}
.cv .it{margin:10px 0}.cv .r{display:flex;justify-content:space-between;gap:10px}.cv .r span{color:#444;white-space:nowrap;font-size:14px}.cv .cm{font-style:italic;color:#333}
.cv.modern header{border-inline-start:8px solid var(--ac);padding-inline-start:16px}.cv.modern h1{color:var(--g)}.cv.modern .ttl{color:var(--g2);font-weight:700}.cv.modern h2{color:var(--g);border-bottom:2px solid var(--ac);padding-bottom:3px}
.cv.clean header{text-align:center;border-bottom:1.5px solid #000;padding-bottom:12px}.cv.clean h2{border-bottom:1px solid #999;padding-bottom:2px;letter-spacing:1.5px}
.cv.simple h1{font-size:30px}.cv.simple h2{font-size:16px;text-decoration:underline;text-transform:none}
.cv .ct{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.cv.clean .ct{justify-content:center}.cv .ci{direction:ltr;unicode-bidi:isolate;display:inline-block}
.cv[dir=rtl] *{letter-spacing:0!important;text-transform:none!important}
@media(max-width:899px){.hero,.eg{grid-template-columns:1fr}.mock{display:none}.hero{padding-top:30px}.mt{display:flex}#p-ed.vf #pcol,#p-ed.vp #fcol{display:none}.nav nav{order:5;flex-basis:100%;overflow-x:auto}.nav{gap:8px;padding:8px 12px}.nav .cta{display:none}.nav .lw{margin-inline-start:auto}.lg{font-size:18px}.lg img{width:36px;height:36px}}
.fab{position:fixed;bottom:18px;inset-inline-start:16px;z-index:8;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;background:linear-gradient(135deg,#f2a20c,#ffc233);color:#1c1300;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 8px 24px #f2a20c80,0 0 0 0 #f2a20c80;animation:fp 2.2s infinite}
.fab:active{filter:brightness(.95)}.fab span{font-size:20px;line-height:1}body.io .fab{display:none}
@keyframes fp{0%{box-shadow:0 8px 24px #f2a20c80,0 0 0 0 #f2a20c70}70%{box-shadow:0 8px 24px #f2a20c80,0 0 0 16px #f2a20c00}100%{box-shadow:0 8px 24px #f2a20c80,0 0 0 0 #f2a20c00}}
main{padding-bottom:84px}
@media print{.fab{display:none!important}@page{size:A4;margin:14mm}body{background:#fff}#intro,.nav,footer,#toast,.pg:not(#p-ed),#fcol,.tools,.mt{display:none!important}main{padding:0;max-width:none}#p-ed,.eg,#pcol{display:block!important;padding:0}.pv{overflow:visible;height:auto!important;border:0;background:none}#pw{position:static;transform:none!important;width:auto}.cv{width:auto;min-height:0;padding:0}}

const mini=(tpl,k,w,h)=>`<div class="mv" style="--k:${k};--w:${w};--h:${h}"><div class="mi">${cv(SAMPLE,tpl,S.lang)}</div></div>`;
function renderPaper(){$('#paper').innerHTML=cv(S.d,S.tpl,S.lang);fit()}
function fit(){const pv=$('#pv'),pw=$('#pw'),k=Math.min(1,(pv.clientWidth-24)/794);if(!pv.clientWidth)return;pw.style.transform=`translateX(-50%) scale(${k})`;pv.style.height=($('#paper').offsetHeight*k+24)+'px'}
addEventListener('resize',fit);
/* النماذج */
function renderTools(){$('#tsw').innerHTML=TPLS.map(t=>`<button data-t="${t}" class="${S.tpl==t?'on':''}">${NAMES[t]}</button>`).join('')}
function renderTpl(){$('#tg').innerHTML=TPLS.map(t=>`<div class="tc"><div>${mini(t,.37,'100%','340px')}</div><b>${NAMES[t]}</b><button class="btn s" data-u="${t}">${L().useT}</button></div>`).join('');$('#mock').innerHTML=mini('modern',.38,'300px','390px')}
/* المحرر */
const card=(kind,i,o,fs)=>`<div class="ic"><button class="x" data-a="rm" data-kind="${kind}" data-i="${i}">✕ ${L().rm}</button>${fs.map(([k,lab,ty])=>`<div class="${ty=='h'?'half':''}"><label>${lab}</label>${ty=='a'?`<textarea rows="3" data-kind="${kind}" data-i="${i}" data-k="${k}">${esc(o[k])}</textarea>`:`<input data-kind="${kind}" data-i="${i}" data-k="${k}" value="${esc(o[k])}">`}</div>`).join('')}</div>`;
function renderForm(){const l=L(),d=S.d,t=S.tab,f=(k,lab,ty='text')=>`<label>${lab}</label><input type="${ty}" data-k="${k}" value="${esc(d[k])}"${ty!='text'?' dir="ltr"':''}>`;let h='';
 $('#tabs').innerHTML=['basics','work','edu','skills'].map(k=>`<button data-tab="${k}" class="${t==k?'on':''}">${l[k]}</button>`).join('');
 if(t=='basics')h=f('name',l.name)+f('title',l.title)+f('email',l.email,'email')+f('phone',l.phone,'tel')+`<label>${l.summary}</label><textarea rows="5" data-k="summary">${esc(d.summary)}</textarea>`;
 else if(t=='work')h=d.work.map((w,i)=>card('work',i,w,[['t',l.pos],['c',l.co],['f',l.from,'h'],['to',l.to,'h'],['d',l.desc,'a']])).join('')+`<button class="btn l" style="margin-top:10px" data-a="addW">${l.addW}</button>`;
 else if(t=='edu')h=d.edu.map((w,i)=>card('edu',i,w,[['g',l.deg],['s',l.sch],['f',l.from,'h'],['to',l.to,'h']])).join('')+`<button class="btn l" style="margin-top:10px" data-a="addE">${l.addE}</button>`;
 else h=`<label>${l.skills}</label><div class="row2"><input id="sk" placeholder="${l.skPh}"><button class="btn" data-a="addS">${l.add}</button></div><div class="chips">${d.skills.map((s,i)=>`<span>${esc(s)}<button data-a="rmS" data-i="${i}">✕</button></span>`).join('')}</div>`;
 $('#form').innerHTML=h}
$('#form').addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k)return;if(t.dataset.kind)S.d[t.dataset.kind][+t.dataset.i][k]=t.value;else S.d[k]=t.value;renderPaper();save()});
$('#form').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i,d=S.d;
 if(a=='addW')d.work.push({t:'',c:'',f:'',to:'',d:''});else if(a=='addE')d.edu.push({g:'',s:'',f:'',to:''});else if(a=='rm')d[b.dataset.kind].splice(i,1);
 else if(a=='rmS')d.skills.splice(i,1);else if(a=='addS'){const v=$('#sk').value.trim();if(v)v.split(/[,،]/).map(x=>x.trim()).filter(Boolean).forEach(x=>d.skills.push(x))}
 renderForm();renderPaper();save();if(a=='addS')$('#sk').focus()});
$('#form').addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='sk'){e.preventDefault();$('[data-a=addS]').click()}});
$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){S.tab=b.dataset.tab;renderForm();save()}};
$('#tsw').onclick=e=>{const b=e.target.closest('[data-t]');if(b){S.tpl=b.dataset.t;renderTools();renderPaper();save()}};
$('#tg').onclick=e=>{const b=e.target.closest('[data-u]');if(b){S.tpl=b.dataset.u;renderTools();renderPaper();save();go('ed')}};
$('.mt').onclick=e=>{const b=e.target.closest('[data-v]');if(b){$('#p-ed').className='pg on '+b.dataset.v;fit()}};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',3500)}
function reset(){if(confirm(L().confirm)){S.d=E0();renderForm();renderPaper();save()}}
let _lib,_busy;
function loadLib(){if(window.html2pdf)return Promise.resolve();return _lib||(_lib=new Promise((ok,no)=>{const x=document.createElement('script');x.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';x.onload=ok;x.onerror=()=>{_lib=null;no()};setTimeout(()=>{if(!window.html2pdf){_lib=null;no()}},8000);document.head.appendChild(x)}))}
async function dl(){if(_busy)return;_busy=1;const name=(S.d.name||'CV').replace(/[\\/:*?"<>|]/g,'').trim()||'CV';
 try{await loadLib();
  const h=document.createElement('div');h.style.cssText='position:absolute;top:0;left:0;width:794px;background:#fff;z-index:-1;pointer-events:none';h.innerHTML=cv(S.d,S.tpl,S.lang);const el=h.firstChild;el.style.minHeight='1100px';document.body.appendChild(h);
  const sx=scrollX,sy=scrollY;scrollTo(0,0);await new Promise(r=>setTimeout(r,150));
  try{await html2pdf().set({margin:0,filename:name+' - CV.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',width:794,windowWidth:794,x:0,y:0,scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css'],avoid:'.it'}}).from(el).save()}finally{h.remove();scrollTo(sx,sy)}}
 catch(e){try{const o=document.title;document.title=name+' - CV';print();document.title=o}catch(_){}toast({ar:'تعذّر التنزيل هنا. افتح الملف في متصفح مثل Chrome ثم حاول مجدداً.',en:'Download failed here. Open the file in a browser like Chrome and try again.',de:'Download fehlgeschlagen. Öffne die Datei in einem Browser wie Chrome.',fr:'Échec du téléchargement. Ouvrez le fichier dans un navigateur comme Chrome.'}[S.lang])}
 finally{_busy=0}}
setTimeout(()=>loadLib().catch(()=>{}),1500);
/* الصفحات واللغة */
const PG=['home','tpl','ed'];
let NAV=[];
function show(p,np){if(!PG.includes(p))p='home';$$('.pg').forEach(s=>s.classList.toggle('on',s.id=='p-'+p));$$('.nav nav a').forEach(a=>a.classList.toggle('on',a.dataset.p==p));scrollTo(0,0);if(p=='ed'){$('#p-ed').classList.add($('#p-ed').classList.contains('vp')?'vp':'vf');fit();setTimeout(fit,60)}
 if(!np){if(NAV.length>1&&NAV[NAV.length-2]==p)NAV.pop();else if(NAV[NAV.length-1]!=p)NAV.push(p)}}
function goBack(){NAV.pop();const q=NAV[NAV.length-1];if(!q){NAV=[];document.body.classList.add('io');$('#intro').style.display='flex';scrollTo(0,0);return}show(q,1);try{history.replaceState(null,'','#'+q)}catch(e){}}
function go(p){if(location.hash=='#'+p)show(p);else location.hash=p}
addEventListener('hashchange',()=>show(location.hash.slice(1)));
$$('.nav nav a').forEach(a=>a.onclick=()=>go(a.dataset.p));
function applyLang(){const l=L();document.documentElement.lang=S.lang;document.documentElement.dir=S.lang=='ar'?'rtl':'ltr';
 $$('[data-i]').forEach(e=>e.textContent=l[e.dataset.i]);$('#h1').innerHTML=esc(l.h1[0])+'<span class="ac">'+l.h1[1]+'</span>'+esc(l.h1[2]);
 $('#lang').value=S.lang;$('#lang2').value=S.lang;renderTools();renderTpl();renderForm();renderPaper()}
['#lang','#lang2'].forEach(x=>$(x).onchange=e=>{S.lang=e.target.value;applyLang();save()});
$('#enter').onclick=()=>{NAV=[];document.body.classList.remove('io');$('#intro').style.display='none';show('home');const h=location.hash.slice(1);if(h&&h!='home')show(h)};
applyLang();show(location.hash.slice(1));
</script></body></html>
